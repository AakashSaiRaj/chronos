# Secrets management: the database DSN is mounted from AWS Secrets Manager by the
# Secrets Store CSI driver, using the pod's own IRSA identity.
#
# Why this rather than a Kubernetes Secret:
#
#   * There is no Secret object to list. Anyone with cluster-wide secret read
#     access -- which is more people than intended in most clusters -- cannot read
#     the database password.
#   * Nothing long-lived is synced. The value is fetched at pod start and
#     refreshed in place, so rotating the credential in Secrets Manager does not
#     require re-creating a Secret.
#   * Authorization is the pod's, not a controller's. There is no operator holding
#     broad read access to every secret in the account.
#
# The tradeoff: the value arrives as a file, so the process must read it from
# disk. Chronos reads CHRONOS_DATABASE_URL from the environment, which is why the
# deployments source it via an entrypoint that reads the mounted file -- see the
# `args` in the deployments.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: chronos-database
  namespace: chronos
  labels:
    app.kubernetes.io/name: chronos
spec:
  provider: aws
  parameters:
    # objectName is patched per environment with the Terraform output
    # `database_secret_name`.
    objects: |
      - objectName: "PLACEHOLDER-chronos-database"
        objectType: "secretsmanager"
        jmesPath:
          - path: "url"
            objectAlias: "database-url"
