# Separate service accounts for the control plane and the workers.
#
# This is the Kubernetes half of the IAM split: each is annotated with its own
# IRSA role, so a compromised worker pod cannot read the database secret the
# server pods can. The annotation value is patched per environment, because the
# role ARN comes from Terraform.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chronos-server
  namespace: chronos
  labels:
    app.kubernetes.io/name: chronos
    app.kubernetes.io/component: server
  annotations:
    # Patched by the overlay from the Terraform output `server_role_arn`.
    eks.amazonaws.com/role-arn: "arn:aws:iam::000000000000:role/PLACEHOLDER-server"
# Chronos never calls the Kubernetes API, so its pods have no business holding a
# mounted API token.
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chronos-worker
  namespace: chronos
  labels:
    app.kubernetes.io/name: chronos
    app.kubernetes.io/component: worker
  annotations:
    # Patched from the Terraform output `worker_role_arn`. The role it points at
    # deliberately grants no AWS permissions at all.
    eks.amazonaws.com/role-arn: "arn:aws:iam::000000000000:role/PLACEHOLDER-worker"
automountServiceAccountToken: false
