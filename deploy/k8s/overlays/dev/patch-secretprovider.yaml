# Which Secrets Manager secret to mount, substituted from the Terraform output
# `database_secret_name`.
#
# Only the secret's *name* appears here. The value is fetched at pod start by the
# CSI driver using the pod's IRSA identity, so the DSN never lands in a manifest,
# a ConfigMap, a Kubernetes Secret, or the Git history.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: chronos-database
  namespace: chronos
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "${CHRONOS_DATABASE_SECRET_NAME}"
        objectType: "secretsmanager"
        jmesPath:
          - path: "url"
            objectAlias: "database-url"
