# Debug logging in dev, and a smaller connection pool to match the smaller
# database instance. The pool size is per replica, so this is the number that
# keeps a scale-up event from exhausting db.t4g.micro's connection budget.
apiVersion: v1
kind: ConfigMap
metadata:
  name: chronos-config
  namespace: chronos
data:
  CHRONOS_LOG_LEVEL: "debug"
  CHRONOS_DB_MAX_CONNS: "10"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: chronos-worker-config
  namespace: chronos
data:
  CHRONOS_LOG_LEVEL: "debug"
  # Lower concurrency per pod, so scaling behaviour is observable with a handful
  # of pods rather than needing a real load generator.
  CHRONOS_WORKER_CONCURRENCY: "2"
